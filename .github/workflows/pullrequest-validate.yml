on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  validate:
    runs-on: ubuntu-slim
    steps:
      - name: Validate Jira tickets in PR title
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          which gh
          # fetch PR title dynamically
          PR_TITLE="$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title --jq '.title')"
          if [[ ! "$PR_TITLE" =~ ^TRF-[0-9]+ ]]; then
            echo "::error title='PR title MUST start with a JIRA ticket [e.g, TRF-1234]'::To fix: 1. Update title to include ticket, and 2. rerun the failed workflow, or close+reopen the PR"
            exit 1
          fi
